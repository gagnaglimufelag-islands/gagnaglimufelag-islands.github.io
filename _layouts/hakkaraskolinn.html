---
layout: default
---
<div class="home school-page">
  <section class="home-hero school-hero" aria-labelledby="school-title">
    <div class="hero-copy">
      <span class="eyebrow">Kennsla og æfingar</span>
      <h1 id="school-title">{{ page.title | escape }}</h1>
      <div class="hero-lead">{{ page.intro | markdownify }}</div>
      <div class="hero-actions">
        <a class="button button-primary" href="https://{{ site.data.status.qualifiers.domain }}">Skráðu þig í Hakkaraskólann <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="hero-visual school-mark" aria-hidden="true">
      <img src="{{ '/assets/favicons/favicon.svg' | relative_url }}" alt="" width="160" height="160">
    </div>
  </section>

  <section class="home-content-card" aria-labelledby="school-competition-title">
    <div class="section-heading">
      <h2 id="school-competition-title">Þátttaka í landskeppninni</h2>
    </div>
    {{ content }}
  </section>
</div>
